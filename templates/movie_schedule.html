<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание кинотеатров</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .cinema {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
        }
        .showtimes {
            margin-top: 10px;
        }
        .time-button {
            margin-right: 5px;
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Расписание</h1>

    {% if schedules %}
        {% for schedule in schedules %}
            <div class="cinema">
                <h2>{{ schedule.cinema_name }}</h2>
                <p>{{ schedule.address }}</p>
                <p>{{ schedule.metro }}</p>
                <div class="showtimes">
                    {% for time in schedule.showtimes %}
                        <button class="time-button">{{ time }}</button>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p>Расписание не найдено.</p>
    {% endif %}
</body>
</html>
