<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #fff;
        }
        .card {
            background-color: #2c2f38;
            border: none;
        }
        .card-header {
            background-color: #343a40;
            color: #fff;
        }
        .btn-back {
            background-color: #28a745;
            color: #fff;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-back:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .btn-back:focus, .btn-back:active {
            outline: none;
            box-shadow: none;
        }
        .card-body {
            padding: 2rem;
        }
        .profile-info {
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .profile-info strong {
            color: #fff; /* Белый цвет для меток */
        }
        .username {
            color: #f0ad4e; /* Замените этот цвет, если хотите другой */
            font-size: 1.5rem;
            font-weight: bold;
        }
        .card-footer {
            background-color: #343a40;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h1 class="text-center mb-4">Личный кабинет</h1>

        <div class="card mx-auto" style="max-width: 600px;">
            <div class="card-header text-center">
                <h4>Привет, <span class="username">{{ user.username }}</span>!</h4>
            </div>
            <div class="card-body">
                <div class="profile-info">
                    <strong>Имя пользователя:</strong> {{ user.username }}
                </div>
                <div class="profile-info">
                    <strong>Электронная почта:</strong> {{ user.email }}
                </div>
                <div class="profile-info">
                    <strong>Дата регистрации:</strong> {{ user.date_joined|date:"d M Y" }}
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'logout' %}" class="btn btn-danger">Выход</a>
                </div>
            </div>
            <div class="card-footer">
                <a href="{% url 'index' %}" class="btn-back">Назад на главную страницу</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
