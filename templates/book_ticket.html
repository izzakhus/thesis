<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бронирование билета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4 text-center">Бронирование билета на:<br><strong>{{ movie.title }}</strong></h2>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.seats.label_tag }}
            {{ form.seats }}
        </div>
        <button type="submit" class="btn btn-success w-100">Забронировать</button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'index' %}" class="btn btn-outline-light">← Назад на главную</a>
    </div>
</div>
</body>
</html>
