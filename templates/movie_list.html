<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Киноафиша</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: white;
            color: black;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .nav-link {
            color: #333;
            font-weight: 500;
        }
        .nav-link:hover {
            color: black;
        }
        .date-selector .btn {
            margin-right: 0.5rem;
            border-radius: 20px;
            background-color: #f2f2f2;
        }
        .date-selector .btn.active {
            background-color: #000;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
        <a class="navbar-brand" href="#">🎬 КиноАфиша</a>
        <div class="d-flex align-items-center">
            <span class="me-3"><i class="bi bi-geo-alt"></i> Алмата</span>
            <a href="#" class="me-3 text-decoration-none">Мои билеты</a>
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Профиль</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Все фильмы в Алмата</h2>
        <div class="date-selector mb-4 d-flex flex-wrap">
            {% for day in days %}
                <button class="btn {% if day.selected %}active{% endif %}">{{ day.date }}</button>
            {% endfor %}
        </div>
        <div class="mb-4">
            <button class="btn btn-outline-secondary me-2">Все жанры</button>
            <button class="btn btn-outline-secondary me-2">Премьеры недели</button>
        </div>

        <!-- Тут будут карточки фильмов -->
        <div class="row">
            {% for movie in movies %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <img src="{{ movie.poster.url }}" class="card-img-top" alt="{{ movie.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ movie.title }}</h5>
                        <a href="{% url 'movie_detail' movie.id %}" class="btn btn-primary">Подробнее</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
